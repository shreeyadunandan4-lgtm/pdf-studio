name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name pdf_studio --platforms android .
      - run: cp main.dart lib/main.dart
      - run: flutter pub add pdf printing image_picker file_selector google_fonts
      - run: sed -i 's/android:label="[^"]*"/android:label="Zod PDF"/' android/app/src/main/AndroidManifest.xml
      - run: pip install pillow
      - run: python3 make_icons.py
      - name: Lint band karo
        run: |
          f=android/build.gradle.kts
          if [ -f "$f" ]; then
            printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.startsWith("lint")) { enabled = false }\n    }\n}\n' >> "$f"
          else
            f=android/build.gradle
            printf '\nsubprojects {\n    tasks.configureEach { t ->\n        if (t.name.startsWith("lint")) { t.enabled = false }\n    }\n}\n' >> "$f"
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zod-pdf-apk
          path: build/app/outputs/flutter-apk/app-release.apk
